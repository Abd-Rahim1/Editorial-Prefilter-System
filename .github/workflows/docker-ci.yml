name: CI/CD - Docker

on:
  push:
    branches:
      - TFG
  pull_request:
    branches:
      - TFG

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: editorial_prefilter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d editorial_prefilter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: editorial_prefilter
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres123
      ENVIRONMENT: test
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt
          pip install pytest

      - name: Check PostgreSQL
        run: |
          python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); s.close(); print('PostgreSQL is reachable')"

      - name: Run tests
        run: pytest -q tests

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/abd-rahim1/editorial-prefilter-api:latest
            ghcr.io/abd-rahim1/editorial-prefilter-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            API_URL=http://api:8000
          tags: |
            ghcr.io/abd-rahim1/editorial-prefilter-web:latest
            ghcr.io/abd-rahim1/editorial-prefilter-web:${{ github.sha }}